name: Daily Process Recurring Transactions

on:
  schedule:
    # Runs every day at 00:00 UTC (tương đương 7:00 AM giờ Việt Nam)
    - cron: "0 0 * * *"
  workflow_dispatch: # Cho phép chạy thủ công qua GitHub UI

jobs:
  process-recurring:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run daily recurring transaction processor
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/daily-process-recurring.mjs